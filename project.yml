name: SavingsSentence
options:
  bundleIdPrefix: com.savingssentence
targets:
  SavingsSentence:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - ".github"
          - "project.yml"
          - "build.yml"
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.savingssentence.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
