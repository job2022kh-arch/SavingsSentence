name: Build IPA

on: [push, pull_request]

jobs:

  build:
  
    runs-on: macos-latest
    
    steps:
    
      - uses: actions/checkout@v3
      
      - name: Install XcodeGen
      
        run: brew install xcodegen
        
      - name: Generate Xcode Project
      
        run: xcodegen generate
        
      - name: Build IPA
      
        run: |
        
          xcodebuild archive \
          
            -project SavingsSentence.xcodeproj \
            
            -scheme SavingsSentence \
            
            -archivePath SavingsSentence.xcarchive \
            
            -sdk iphoneos \
            
            CODE_SIGNING_ALLOWED=NO
            
          mkdir -p Payload
          
          cp -r SavingsSentence.xcarchive/Products/Applications/*.app Payload/
          
          zip -r SavingsSentence.ipa Payload
          
      - name: Upload IPA
      
        uses: actions/upload-artifact@v3
        
        with:
        
          name: SavingsSentence-IPA
          
          path: SavingsSentence.ipa
          
























